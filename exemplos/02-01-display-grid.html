<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Básico - Grid Layout - Exemplo de WebDesign</title>
    <style>
        :root {
            --bg: #f7f7f9;
            --card: #ffffff;
            --text: #2c3e50;
            --muted: #6b7280;
            --primary: #667eea;
            --primary-2: #764ba2;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.6rem;
        }

        p.lead {
            margin: 0;
            color: var(--muted);
        }

        section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        section h2 {
            font-size: 1.1rem;
            margin: 0 0 12px;
        }

        .badge {
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: 8px;
        }

        .container {
            display: grid;
            background-color: #f0f0f0;
            padding: 10px;
        }

        .item {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            border: 1px solid #fff;
        }

        .code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: .9rem;
            background: #f3f4f6;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 10px;
            overflow: auto;
            white-space: pre;
        }
    </style>
</head>

<body>

    <head>
        <h1>Básico - Grid Layout - Exemplo de WebDesign</h1>
    </head>

    <main>
        <section>
            <h2>Exemplo de display: grid;</h2>
            <p class="badge">display: grid</p>
            <div class="container">
                <div class="item">Item 1</div>
                <div class="item">Item 2</div>
                <div class="item">Item 3</div>
            </div>
            <pre class="code">.container { display: grid; }</pre>
        </section>
    </main>
</body>

</html>
